<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body>
<div style="position:absolute;right:-90px;top:-110px;width:600px;height:600px;z-index:0;
background:radial-gradient(circle,rgba(181,204,122,.07),transparent 68%)"></div>
<div class="frame">
  <div class="top"><span class="id">Mneme HQ</span><span class="fam">{{family_label}}</span><span class="rule"></span></div>
  <div class="body">
    <div style="display:inline-flex;align-items:center;gap:14px;border:2px solid rgba(181,204,122,.42);
      background:rgba(181,204,122,.1);border-radius:100px;padding:12px 26px;margin-bottom:24px;align-self:flex-start">
      <span style="width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block"></span>
      <span style="font-family:'DM';font-size:30px;font-weight:500;color:var(--accent);letter-spacing:.06em">{{badge}}</span>
    </div>
    <h1 style="font-size:{{headline_px}}px;letter-spacing:-2.4px;line-height:1;margin-bottom:28px">{{name}}</h1>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px">{{chain_html}}</div>
    <div class="sup" style="color:var(--text)">{{sup}}</div>
  </div>
</div>
</body></html>
