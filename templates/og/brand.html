<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body>
<div style="position:absolute;inset:0;z-index:0">
  <img src="../../site/assets/images/{{image}}" style="position:absolute;right:0;top:0;width:54%;height:100%;object-fit:cover;filter:saturate(.7) contrast(1.06)">
  <div style="position:absolute;inset:0;background:linear-gradient(100deg,#0c0c0d 44%,rgba(12,12,13,.95) 56%,rgba(12,12,13,.32) 80%,rgba(12,12,13,.12) 100%)"></div>
</div>
<div class="frame">
  <div class="top"><span class="id">Mneme HQ</span><span class="rule" style="background:var(--action)"></span></div>
  <div class="body" style="max-width:700px">
    <h1 style="font-size:{{headline_px}}px;letter-spacing:-3px;line-height:.98">{{lines_html}}</h1>
    <div class="sup" style="margin-top:28px;max-width:560px">{{sup}}</div>
  </div>
</div>
</body></html>
