name: Generate OG preview set

on:
  workflow_dispatch:
  push:
    branches:
      - feat/og-system-v2
    paths:
      - scripts/generate_og_images.py
      - scripts/ensure_og_coverage.py
      - .github/workflows/generate-og-preview.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/og-system-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generate priority OG cards
        run: |
          python scripts/generate_og_images.py --only \
            / \
            /demo/ \
            /benchmark/ \
            /pilot/ \
            /concepts/architectural-drift-prevention/ \
            /integrations/codex-cli/ \
            /integrations/antigravity/ \
            /integrations/claude-code/

      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/og-home-v2.png \
            site/demo/og.png \
            site/benchmark/og.png \
            site/pilot/og.png \
            site/concepts/architectural-drift-prevention/og.png \
            site/integrations/codex-cli/og.png \
            site/integrations/antigravity/og.png \
            site/integrations/claude-code/og.png
          if git diff --cached --quiet; then
            echo "No generated image changes."
            exit 0
          fi
          git commit --no-verify -m "chore: generate OG v2 preview cards"
          git push origin HEAD:feat/og-system-v2
