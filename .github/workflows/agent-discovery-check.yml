name: Agent discovery contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_agent_discovery.py'
      - 'scripts/core_version.json'
      - 'site/.well-known/**'
      - 'site/llms.txt'
      - 'site/index.html'
      - 'site/integrations/index.html'
      - 'site/docs/mcp/index.html'
      - 'site/.htaccess'
      - '.github/workflows/agent-discovery-check.yml'
      - '.github/workflows/mcp-tool-catalog-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check_agent_discovery.py'
      - 'scripts/core_version.json'
      - 'site/.well-known/**'
      - 'site/llms.txt'
      - 'site/index.html'
      - 'site/integrations/index.html'
      - 'site/docs/mcp/index.html'
      - 'site/.htaccess'
      - '.github/workflows/agent-discovery-check.yml'
      - '.github/workflows/mcp-tool-catalog-check.yml'
  schedule:
    - cron: '30 6 * * *'
  # Primary signal: the core release workflow announces a new PyPI release.
  # The daily schedule above is the fallback if that dispatch never arrives.
  repository_dispatch:
    types: [core-released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-contract:
    name: Verify local discovery graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_agent_discovery.py

  external-trust:
    name: Verify PyPI, core metadata, and MCP Registry
    needs: local-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # One alert writer at a time, so a dispatch and the cron cannot both
    # open an issue. Only the issue-writing events share the group; PR and
    # push runs get a unique group so they never queue behind (or cancel) an
    # alert run.
    concurrency:
      group: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'core-release-alert' || format('agent-discovery-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Online discovery check
        id: online
        continue-on-error: true
        shell: bash
        run: python scripts/check_agent_discovery.py --online 2>&1 | tee online.txt; exit ${PIPESTATUS[0]}
      # A failed scheduled run notifies nobody, so a core release went
      # undocumented for days. Keep exactly one open issue per mismatch:
      # create it once, then comment on it until the site catches up.
      - name: Raise core-release issue
        if: >-
          steps.online.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          label=core-release-drift
          gh label create "$label" --color B60205 \
            --description "Site docs lag the released mneme-hq core" 2>/dev/null || true
          {
            echo "The \`$GITHUB_EVENT_NAME\` run $RUN_URL found the site out of step with the released core:"
            echo
            echo '```'
            # A crash before the summary line still yields an issue, with the tail.
            grep -E '^(agent-discovery|  - )' online.txt || tail -n 40 online.txt
            echo '```'
            echo
            echo "Reconcile the site: bump \`scripts/core_version.json\` with \`scripts/sync_core_version.py\`, regenerate the version-bound artifacts, and re-verify the docs against the release. The daily check stays red until that lands."
          } > issue-body.md
          # REST, not `gh issue list`: that goes through the search index,
          # which lags a just-created issue and would let a second run duplicate it.
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=$label&state=open&per_page=10"             --jq '[.[] | select(.pull_request | not)][0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file issue-body.md
          else
            gh issue create --label "$label" \
              --title "Released mneme-hq core is ahead of mnemehq.com" --body-file issue-body.md
          fi
      - name: Fail when the online check failed
        if: steps.online.outcome == 'failure'
        run: exit 1
