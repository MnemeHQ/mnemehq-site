name: Deploy Audit API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'audit/backend/**'
      - 'audit/backend/Dockerfile'
      - 'audit/backend/requirements.txt'
      - 'audit/backend/alembic/**'
      - 'audit/backend/deploy/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: choice
        options:
          - staging
          - prod
        default: 'prod'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  INSTANCE_NAME: mneme-audit-db
  DB_NAME: mneme_audit
  DB_USER: mneme_audit_user
  DB_PASSWORD_SECRET: mneme-audit-db-password
  SERVICE_ACCOUNT: mneme-audit-run@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  VPC_CONNECTOR: mneme-vpc-connector
  SERVICE_NAME: mneme-audit-api
  APP_VERSION: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy Audit API to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'cloud-sql-proxy'

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_URL="gcr.io/${PROJECT_ID}/mneme-audit-api:${APP_VERSION}"
          docker build -f audit/backend/Dockerfile -t "${IMAGE_URL}" .
          docker push "${IMAGE_URL}"

      - name: Run database migrations
        run: |
          # Start Cloud SQL Auth Proxy
          cloud-sql-proxy --port 5432 "${PROJECT_ID}:${REGION}:${INSTANCE_NAME}" &
          PROXY_PID=$!
          sleep 5
          
          # Get DB password from Secret Manager
          DB_PASSWORD=$(gcloud secrets versions access latest --secret="${DB_PASSWORD_SECRET}")
          export DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}"
          
          cd audit/backend
          alembic upgrade head
          
          # Clean up
          kill $PROXY_PID

      - name: Deploy to Cloud Run
        run: |
          # Substitute variables in service.yaml
          sed -e "s|\${PROJECT_ID}|${PROJECT_ID}|g" \
              -e "s|\${REGION}|${REGION}|g" \
              -e "s|\${INSTANCE_NAME}|${INSTANCE_NAME}|g" \
              -e "s|\${PROJECT_ID}:${REGION}:${INSTANCE_NAME}|${PROJECT_ID}:${REGION}:${INSTANCE_NAME}|g" \
              -e "s|\${SERVICE_ACCOUNT}|${SERVICE_ACCOUNT}|g" \
              -e "s|\${VPC_CONNECTOR}|${VPC_CONNECTOR}|g" \
              -e "s|\${IMAGE_URL}|gcr.io/${PROJECT_ID}/mneme-audit-api:${APP_VERSION}|g" \
              -e "s|\${DB_USER}|${DB_USER}|g" \
              -e "s|\${DB_PASSWORD}|$(gcloud secrets versions access latest --secret=${DB_PASSWORD_SECRET})|g" \
              -e "s|\${APP_VERSION}|${APP_VERSION}|g" \
              audit/backend/deploy/service.yaml | gcloud run services replace - --region="${REGION}"

      - name: Wait for deployment
        run: |
          gcloud run services wait "${SERVICE_NAME}" --region="${REGION}" --timeout=300s

      - name: Health check
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" --region="${REGION}" --format="value(status.url)")
          echo "Service URL: ${SERVICE_URL}"
          
          # Wait a bit for service to be ready
          sleep 10
          
          if curl -sf "${SERVICE_URL}/health" > /dev/null; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED"
            exit 1
          fi

      - name: Record deployment provenance
        if: success()
        run: |
          DEPLOYED_SHA=$(git rev-parse HEAD)
          {
            echo "## Deployment provenance"
            echo "- Deploy actor: github-actions"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Workflow initiator: @${GITHUB_ACTOR}"
            echo "- Workflow SHA: ${GITHUB_SHA}"
            echo "- Service: mneme-audit-api"
            echo "- Image: gcr.io/${PROJECT_ID}/mneme-audit-api:${APP_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"