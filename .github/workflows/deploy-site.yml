name: Deploy site to mnemehq.com

# This repository owns production deployment of mnemehq.com: pushes to main that
# touch site/** or scripts/deploy_site.py deploy automatically, the daily
# schedule catches any commit that skipped the push trigger, and
# workflow_dispatch allows a manual redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/deploy_site.py'
      - 'scripts/deploy_verify.py'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  deploy:
    name: Upload changed site files via cPanel API
    # Runs on a Mneme-specific self-hosted runner registered on the shared
    # static-egress GCP VM (Cloud NAT egress 35.209.208.146, whitelisted in
    # Krystal). GitHub-hosted runners use rotating IPs the cPanel firewall
    # blocks, so the upload must leave from the whitelisted static IP.
    #
    # This is a SEPARATE runner registration from the core repository's runner —
    # repo-scoped self-hosted runners are not shared across repositories.
    # Register a dedicated runner service on the same VM, attached to THIS
    # repository (MnemeHQ/mnemehq-site), with the labels `self-hosted` +
    # `mnemehq-site-deploy`.
    #
    # Security: this job runs ONLY on trusted events (push to main, manual
    # dispatch, and the daily schedule) and never on pull_request, so untrusted
    # PR code is never executed on the self-hosted runner. Do not add a
    # pull_request trigger.
    runs-on: [self-hosted, mnemehq-site-deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          # cPanel endpoint is configurable via repo Variables so we can point at
          # the working HTTPS endpoint (e.g. cpanel.theovalmis.com / 443) without a
          # code change. If unset, deploy_site.py falls back to its built-in default.
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_PORT: ${{ vars.CPANEL_PORT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/deploy_site.py
