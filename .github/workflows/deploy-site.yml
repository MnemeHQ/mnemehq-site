name: Deploy site to mnemehq.com

# This repository owns production deployment of mnemehq.com: pushes to main that
# touch site/** or scripts/deploy_site.py deploy automatically, the daily
# schedule catches any commit that skipped the push trigger, and
# workflow_dispatch allows a manual redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/deploy_site.py'
      - 'scripts/deploy_verify.py'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  deploy:
    name: Upload changed site files via cPanel API
    # MNEME_SITE_RUNNER_LABEL selects the verified deployment runner. During
    # migration the unset variable retains the existing runner; cut over only
    # after the candidate passes the authenticated cPanel connection check.
    # GitHub-hosted runners have rotating IPs that the cPanel firewall blocks.
    #
    # Security: this job runs ONLY on trusted events (push to main, manual
    # dispatch, and the daily schedule) and never on pull_request, so untrusted
    # PR code is never executed on the self-hosted runner. Do not add a
    # pull_request trigger.
    runs-on: [self-hosted, "${{ vars.MNEME_SITE_RUNNER_LABEL || 'mnemehq-site-deploy' }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          # cPanel endpoint is configurable via repo Variables so we can point at
          # the working HTTPS endpoint (e.g. cpanel.theovalmis.com / 443) without a
          # code change. If unset, deploy_site.py falls back to its built-in default.
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_PORT: ${{ vars.CPANEL_PORT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/deploy_site.py

      - name: Record deployment provenance
        if: success()
        shell: bash
        run: |
          DEPLOYED_SHA="$(git rev-parse site-deployed 2>/dev/null || true)"
          {
            echo "## Deployment provenance"
            echo "- Deploy actor: github-actions"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Workflow initiator: @${GITHUB_ACTOR}"
            echo "- Workflow SHA: ${GITHUB_SHA}"
            echo "- site-deployed SHA: ${DEPLOYED_SHA:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
