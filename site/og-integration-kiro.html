<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mneme + Kiro</title>
    <style>
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            background: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .badge {
            background: rgba(200, 240, 96, 0.15);
            color: #c8f060;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(200, 240, 96, 0.3);
        }
        .title-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            font-size: 64px;
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: #ffffff;
        }
        p {
            font-size: 28px;
            color: #a1a1aa;
            margin: 0;
            max-width: 900px;
            line-height: 1.4;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
            font-family: 'DM Mono', monospace;
            font-size: 16px;
            color: #71717a;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">Integration</div>
        <span style="color: #71717a; font-family: 'DM Mono', monospace;">mnemehq.com/integrations/kiro</span>
    </div>
    <div class="title-area">
        <h1>Mneme + Kiro</h1>
        <p>PreToolUse hook integration for architectural invariant enforcement.</p>
    </div>
    <div class="footer">
        <span>Mneme HQ Governance Engine</span>
        <span style="color: #c8f060;">PreToolUse Hook</span>
    </div>
</body>
</html>
