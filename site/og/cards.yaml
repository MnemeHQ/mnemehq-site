    - {label: MNEME HQ, value: Pre-generation, verdict: BLOCKS AT VIOLATION, kind: accent}
  headline: Mneme HQ vs CodeRabbit
  sup: CodeRabbit reviews code after it's written. Mneme HQ enforces constraints before generation.
compare/continue-dev/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs Continue.dev. Continue rules are configuration the model interprets. Mneme
