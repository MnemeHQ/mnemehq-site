    - {label: CLAUDE CODE MEMORY, value: Advisory, verdict: MODEL MAY FOLLOW, kind: warn}
    - {label: MNEME HQ, value: Enforced, verdict: HOOK BLOCKS AT VIOLATION, kind: accent}
  headline: Mneme HQ vs Claude Code Memory
  sup: CLAUDE.md gives the model instructions it may follow. Mneme HQ blocks violations before they're
    written.
compare/claude-md/:
  alt: 'Comparison: Mneme HQ vs CLAUDE.md. A CLAUDE.md tells the model your rules. Mneme enforces the
