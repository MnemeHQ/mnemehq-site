:
  accent: aligned
  headline: Keep AI code aligned with your architecture
  sup: Mneme HQ turns ADRs, standards, and decisions into constraints AI coding agents must follow, enforced
    before generation, not discovered in review.
about/:
  headline: Architectural drift prevention for the agentic AI SDLC.
  sup: Mneme HQ is the lightweight governance layer between your architectural decisions and your AI coding
    tools.
architecture/:
  alt: 'Demo: How Mneme works, precisely. Technical deep dives into the retrieval pipeline, enforcement
    mechanics, and design decisions.'
  headline: How Mneme works, precisely
  rows:
    - [DESIGN, 'Keyword scoring, not ML.', held]
    - [ALTERNATIVE, 'Embeddings, ML, or guesses.', neutral]
    - [EXCLUDED, None in the enforcement path., denied]
  sup: Technical deep dives into the retrieval pipeline, enforcement mechanics, and design decisions.
architecture/decision-memory-vs-documentation/:
  accent: Architectural Authority
  alt: 'Demo: Decision Memory: Where Architectural Authority Lives. Relevance is calculated at read time.
    Authority has to be recorded at write time.'
  headline: 'Decision Memory: Where Architectural Authority Lives'
  rows:
    - [RAG, Retrieves relevant information., neutral]
    - [DOCUMENTATION, 'Knowledge, not authority.', neutral]
    - [DECISION MEM, Holds precedence and scope., held]
  sup: Relevance is calculated at read time. Authority has to be recorded at write time.
architecture/how-retrieval-works/:
  alt: 'Demo: How Retrieval Works in Mneme. Deterministic keyword scoring over structured decision records.'
  headline: How Retrieval Works in Mneme
  rows:
    - [PIPELINE, 'Five stages, fully deterministic.', held]
    - [ALTERNATIVE, Embedding-based search., neutral]
    - [EXCLUDED, No embedding models used., denied]
  sup: Deterministic keyword scoring over structured decision records.
audit/:
  headline: Understand which architectural decisions can actually be governed
  rows:
    - [REPO, Decisions already recorded., neutral]
    - [AUDIT, Classifies its protection level., neutral]
    - [GAP, Shows what's unprotected., held]
  sup: Give Mneme a repository. It identifies architectural decisions, classifies their governability,
    and shows you exactly which ones translate to deterministic enforcement rules.
audit/methodology/:
  alt: 'Demo: Architecture Protection Audit Methodology. What the Audit reads, how decisions are classified,
    and how the protection metrics are calculated.'
  headline: Architecture Protection Audit Methodology
  rows:
    - [READS, 'ADRs, agent rules, config proof.', neutral]
    - [CLASSIFIES, 'Protected, ready, or Guidance.', neutral]
    - [REPORTS, States what the metrics mean., held]
  sup: What the Audit reads, how decisions are classified, and how the protection metrics are calculated.
audit/vs-code-review-security-scanning-and-tests/:
  accent: Security Scanning
  alt: 'Demo: The Audit vs Code Review, Security Scanning & Tests. Different tools answer different questions.
    The Audit examines architectural intent already recorded by the team.'
  headline: The Audit vs Code Review, Security Scanning & Tests
  rows:
    - [REVIEW, Human judgment on a diff., neutral]
    - [SCANNERS, Known vulnerabilities in code., neutral]
    - [AUDIT, Recorded architectural intent., held]
  sup: Different tools answer different questions. The Audit examines architectural intent already recorded
    by the team.
benchmark/:
  alt: 'Demo: Governance Benchmark v1.1. 36 scenarios. Structured fixtures. Deterministic retrieval.'
  headline: Governance Benchmark v1.1
  rows:
    - [SUITE, '36 scenarios, fixed fixtures.', held]
    - [SCORING, 'Deterministic retrieval, no ML.', neutral]
    - [STATUS, 'Live now, results pending.', neutral]
  sup: 36 scenarios. Structured fixtures. Deterministic retrieval.
compare/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs the Alternatives. CodeRabbit, Cursor Rules, Claude Code memory, RAG. How
    each compares to pre-generation enforcement.'
  boxes:
    - {label: ALTERNATIVES, value: Advisory, verdict: MODEL MAY IGNORE, kind: warn}
    - {label: MNEME HQ, value: Enforced, verdict: BLOCKS AT EDIT/WRITE, kind: accent}
  headline: Mneme HQ vs the Alternatives
  sup: CodeRabbit, Cursor Rules, Claude Code memory, RAG. How each compares to pre-generation enforcement.
compare/aider/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs Aider. Aider is one of the best terminal pair programmers. Mneme is the
    typed-decision layer underneath.'
  boxes:
    - {label: AIDER, value: Prose-driven, verdict: MODEL DECIDES PER TURN, kind: warn}
    - {label: MNEME HQ, value: Scope-matched, verdict: SYSTEM DECIDES PER EDIT, kind: accent}
  headline: Mneme HQ vs Aider
  sup: Aider is one of the best terminal pair programmers. Mneme is the typed-decision layer underneath.
compare/claude-code-memory/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs Claude Code Memory. CLAUDE.md gives the model instructions it may follow.
    Mneme HQ blocks violations before they''re written.'
