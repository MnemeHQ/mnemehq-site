: headline: Keep AI code aligned with your architecture
  sup: Mneme HQ turns ADRs, standards, and decisions into constraints AI coding agents must follow, enforced
    before generation, not discovered in review.
about/:
  headline: Architectural drift prevention for the agentic AI SDLC.
  sup: Mneme HQ is the lightweight governance layer between your architectural decisions and your AI coding
    tools.
architecture/:
  headline: How Mneme works, precisely
  sup: Technical deep dives into the retrieval pipeline, enforcement mechanics, and design decisions.
architecture/decision-memory-vs-documentation/:
  headline: 'Decision Memory: Where Architectural Authority Lives'
  sup: Relevance is calculated at read time. Authority has to be recorded at write time.
architecture/how-retrieval-works/:
  headline: How Retrieval Works in Mneme
  sup: Deterministic keyword scoring over structured decision records.
audit/:
  headline: Understand which architectural decisions can actually be governed
  sup: Give Mneme a repository. It identifies architectural decisions, classifies their governability,
    and shows you exactly which ones translate to deterministic enforcement rules.
audit/methodology/:
  headline: Architecture Protection Audit Methodology
  sup: What the Audit reads, how decisions are classified, and how the protection metrics are calculated.
audit/vs-code-review-security-scanning-and-tests/:
  headline: The Audit vs Code Review, Security Scanning & Tests
  sup: Different tools answer different questions. The Audit examines architectural intent already recorded
    by the team.
benchmark/:
  headline: Governance Benchmark v1.1
  sup: 36 scenarios. Structured fixtures. Deterministic retrieval.
compare/:
  headline: Mneme HQ vs the Alternatives
  sup: CodeRabbit, Cursor Rules, Claude Code memory, RAG. How each compares to pre-generation enforcement.
compare/aider/:
  headline: Mneme HQ vs Aider
  sup: Aider is one of the best terminal pair programmers. Mneme is the typed-decision layer underneath.
compare/claude-code-memory/:
  headline: Mneme HQ vs Claude Code Memory
  sup: CLAUDE.md gives the model instructions it may follow. Mneme HQ blocks violations before they're
    written.
compare/claude-md/:
  headline: Mneme HQ vs CLAUDE.md
  sup: A CLAUDE.md tells the model your rules. Mneme enforces the ones that must hold.
compare/coderabbit/:
  headline: Mneme HQ vs CodeRabbit
  sup: CodeRabbit reviews code after it's written. Mneme HQ enforces constraints before generation.
compare/continue-dev/:
  headline: Mneme HQ vs Continue.dev
  sup: Continue rules are configuration the model interprets. Mneme is enforcement the system resolves.
compare/cursor-rules/:
  headline: Mneme HQ vs Cursor Rules
  sup: Cursor Rules are per-repo suggestion files. Mneme HQ is structured enforcement with a precedence
    engine.
compare/devin-vs-architectural-governance/:
  headline: Devin vs Architectural Governance
  sup: Why autonomous coding agents still need deterministic enforcement.
compare/github-copilot/:
  headline: Mneme HQ vs GitHub Copilot
  sup: Copilot writes code. Mneme enforces what that code is allowed to do.
compare/google-antigravity-vs-mneme/:
  headline: Google Antigravity vs Mneme
  sup: Agentic IDEs vs architectural governance. Different layers; they compose.
compare/rag-coding-memory/:
  headline: RAG Coding Memory vs Mneme
  sup: RAG is useful for contextual memory. It is weak as decision memory.
compare/rag-vs-governance/:
  headline: Mneme HQ vs RAG-based Governance
  sup: RAG retrieves relevant context. Mneme enforces architectural constraints.
compare/sourcegraph-cody/:
  headline: Mneme HQ vs Sourcegraph Cody
  sup: Cody answers what the code is. Mneme answers what the edit is allowed to do.
compare/windsurf/:
  headline: Mneme HQ vs Windsurf
  sup: Cascade plans and executes autonomously. Mneme enforces per edit, regardless of run length.
