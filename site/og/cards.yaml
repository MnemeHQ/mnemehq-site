    - {label: CONTINUE.DEV, value: Order-dependent, verdict: NO PRECEDENCE MODEL, kind: warn}
    - {label: MNEME HQ, value: Deterministic, verdict: PRECEDENCE ENGINE RESOLVES, kind: accent}
  headline: Mneme HQ vs Continue.dev
  sup: Continue rules are configuration the model interprets. Mneme is enforcement the system resolves.
compare/cursor-rules/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs Cursor Rules. Cursor Rules are per-repo suggestion files. Mneme HQ is
    structured enforcement with a precedence engine.'
  boxes:
    - {label: CURSOR RULES, value: Advisory, verdict: MAY BE IGNORED, kind: warn}
    - {label: MNEME, value: Enforced, verdict: CANNOT BE SKIPPED, kind: accent}
  headline: Mneme HQ vs Cursor Rules
  sup: Cursor Rules are per-repo suggestion files. Mneme HQ is structured enforcement with a precedence
    engine.
compare/devin-vs-architectural-governance/:
  alt: 'Comparison: Devin vs Architectural Governance. Why autonomous coding agents still need deterministic
    enforcement.'
  boxes:
    - {label: DEVIN, value: Contextual, verdict: VIA PROMPTS AND REASONING, kind: warn}
    - {label: MNEME, value: Deterministic, verdict: BINARY VERDICTS, kind: accent}
  headline: Devin vs Architectural Governance
  sup: Why autonomous coding agents still need deterministic enforcement.
compare/github-copilot/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs GitHub Copilot. Copilot writes code. Mneme enforces what that code is
    allowed to do.'
  boxes:
    - {label: GITHUB COPILOT, value: Model decides, verdict: NO BUILT-IN PRECEDENCE, kind: warn}
    - {label: MNEME HQ, value: Deterministic, verdict: PRECEDENCE ENGINE RESOLVES, kind: accent}
  headline: Mneme HQ vs GitHub Copilot
  sup: Copilot writes code. Mneme enforces what that code is allowed to do.
compare/google-antigravity-vs-mneme/:
  alt: 'Comparison: Google Antigravity vs Mneme. Agentic IDEs vs architectural governance. Different layers;
    they compose.'
  boxes:
    - {label: GOOGLE ANTIGRAVITY, value: Human review, verdict: OUTPUT REVIEWED MANUALLY, kind: warn}
    - {label: MNEME, value: Machine-checkable, verdict: BEFORE AND AFTER GENERATION, kind: accent}
  headline: Google Antigravity vs Mneme
  sup: Agentic IDEs vs architectural governance. Different layers; they compose.
compare/rag-coding-memory/:
  accent: vs
  alt: 'Comparison: RAG Coding Memory vs Mneme. RAG is useful for contextual memory. It is weak as decision
    memory.'
  boxes:
    - {label: RAG CODING MEMORY, value: Probabilistic, verdict: TOP-K RECALL ONLY, kind: warn}
    - {label: MNEME HQ, value: Deterministic, verdict: SCOPE-MATCHED LOOKUP, kind: accent}
  headline: RAG Coding Memory vs Mneme
  sup: RAG is useful for contextual memory. It is weak as decision memory.
compare/rag-vs-governance/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs RAG-based Governance. RAG retrieves relevant context. Mneme enforces architectural
    constraints.'
  boxes:
    - {label: RAG, value: Probabilistic, verdict: MODEL MAY COMPLY, kind: warn}
    - {label: MNEME HQ, value: Deterministic, verdict: VIOLATION IS BLOCKED, kind: accent}
  headline: Mneme HQ vs RAG-based Governance
  sup: RAG retrieves relevant context. Mneme enforces architectural constraints.
compare/sourcegraph-cody/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs Sourcegraph Cody. Cody answers what the code is. Mneme answers what the
    edit is allowed to do.'
  boxes:
    - {label: SOURCEGRAPH CODY, value: Context only, verdict: PASSED TO THE MODEL, kind: warn}
    - {label: MNEME HQ, value: Enforced, verdict: BLOCKS ON VIOLATION, kind: accent}
  headline: Mneme HQ vs Sourcegraph Cody
  sup: Cody answers what the code is. Mneme answers what the edit is allowed to do.
compare/windsurf/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs Windsurf. Cascade plans and executes autonomously. Mneme enforces per
