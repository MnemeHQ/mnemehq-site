    - {label: CLAUDE.MD, value: Advisory, verdict: MAY BE IGNORED, kind: warn}
    - {label: MNEME HQ, value: Enforced, verdict: BLOCKS EDIT/WRITE, kind: accent}
  headline: Mneme HQ vs CLAUDE.md
  sup: A CLAUDE.md tells the model your rules. Mneme enforces the ones that must hold.
compare/coderabbit/:
  accent: vs
  alt: 'Comparison: Mneme HQ vs CodeRabbit. CodeRabbit reviews code after it''s written. Mneme HQ enforces
