<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0c0c0d; color: #e8e8ec; font-family: 'DM Mono', monospace; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(200,240,96,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(200,240,96,.04) 1px, transparent 1px); background-size: 60px 60px; }
  .glow { position: absolute; right: -100px; top: -180px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(200,240,96,.1), transparent 68%); }
  .container { position: relative; z-index: 1; height: 100%; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .top, .bottom { display: flex; align-items: center; justify-content: space-between; }
  .logo, h1 { font-family: 'Instrument Serif', serif; }
  .logo { font-size: 28px; }
  .tag { color: #c8f060; border: 1px solid rgba(200,240,96,.3); background: rgba(200,240,96,.08); border-radius: 999px; padding: 6px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .middle { max-width: 920px; }
  h1 { font-size: 68px; font-weight: 400; line-height: 1.04; letter-spacing: -1.2px; margin-bottom: 22px; }
  h1 em { color: #c8f060; font-weight: 400; }
  p { max-width: 780px; color: #9696a6; font-size: 18px; line-height: 1.6; }
  .bottom { padding-top: 24px; border-top: 1px solid rgba(255,255,255,.1); color: #64646f; font-size: 13px; }
  .surface { color: #c8f060; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="container">
    <div class="top"><span class="logo">Mneme HQ</span><span class="tag">Docs · 0.9.0</span></div>
    <div class="middle"><h1>Local MCP server.<br><em>Six decision tools.</em></h1><p>Install, configure, retrieve, propose, and trace—with human decision authority kept outside MCP.</p></div>
    <div class="bottom"><span>mnemehq.com/docs/mcp</span><span class="surface">Local stdio</span></div>
  </div>
</body>
</html>
